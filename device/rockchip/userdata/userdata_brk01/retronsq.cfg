# Retron SQ settings. Edit this file on a PC; changes apply the next time a
# game starts.

# Emulator core for each system, used for cartridges and for games on the SD
# card. Built in: gpsp, mgba, vbam. Extra cores copied into retroarch/cores
# (for example gambatte_libretro.so) are named without "_libretro.so".
# mgba is slower than gpsp but handles reproduction cartridges' save types
# much better.
GBA_CORE=gpsp
GBC_CORE=vbam
GB_CORE=vbam

# What to show with no cartridge inserted:
#   menu = RetroArch menu with the games in the roms folder
#   none = blank screen, like the original firmware
NO_CART=menu

# Cartridges can be inserted and removed while the console is on.
#   1 = a cartridge starts as soon as it is inserted (the running game is
#       saved and closed first)
#   0 = nothing starts; the cartridge is ready in Cartridge Tools
#       (RetroArch menu > Load Content > Collections)
CART_AUTOLOAD=1

# At power on, how long to wait for a cartridge before showing the menu,
# in seconds after switching on. The cartridge slot only reports a
# cartridge once it has read it, which takes a while. A cartridge that is
# found starts at once; without one, the menu shows after this time.
# logs/launcher.log says when the slot reported the cartridge
# ("boot: cartridge reader ready at ... s"): this can be set a bit above
# that.
CART_WAIT=25

# Reset button. 0 = restart the game right away (the cartridge is only read
# again if it changed). 1 = always read the whole cartridge again.
RESET_REDUMP=0

# 1 = re-check the copy of a cartridge on the SD card every time it starts
# (original firmware behaviour, slower). 0 = trust a copy that was verified.
VERIFY_CACHE=0

# 1 = RetroArch debug log on the serial console
VERBOSE=1
