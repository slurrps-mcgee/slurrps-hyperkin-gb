# Retron SQ settings. Most can also be changed on the console: Home screen >
# Settings. Edit this file on a PC; changes apply the next time a game
# starts.

# Emulator core for each system, used for cartridges and for games on the SD
# card. Built in: gpsp, mgba, vbam. Extra cores copied into retroarch/cores
# (for example gambatte_libretro.so) are named without "_libretro.so".
# mgba is slower than gpsp but handles reproduction cartridges' save types
# much better.
GBA_CORE=gpsp
GBC_CORE=vbam
GB_CORE=vbam

# The start screen, when no game is running:
#   home      = the Retron SQ home screen (games, cartridge, settings)
#   retroarch = RetroArch's own menu, as in firmware 0.2
UI=home

# With no cartridge inserted:
#   menu = show the start screen above
#   none = blank screen, like the original firmware
NO_CART=menu

# Cartridges can be inserted and removed while the console is on.
#   1 = a cartridge starts as soon as it is inserted (the running game is
#       saved and closed first). Leaving its game goes to the home screen.
#   0 = nothing starts; the cartridge is ready on the home screen's
#       Cartridge page
CART_AUTOLOAD=1

# At power on, how long to wait for a cartridge before showing the home
# screen, in seconds after switching on. The cartridge slot only shows up
# once it has read the cartridge, which takes a while: a cartridge seen
# before then starts straight from the splash; one that shows up later
# replaces the home screen when it appears. Higher: the splash waits longer
# for a slow cartridge, but a boot without one is slower. logs/launcher.log
# says when the slot showed up ("boot: cartridge reader pending at ... s").
CART_WAIT=15

# Reset button. 0 = restart the game right away (the cartridge is only read
# again if it changed). 1 = always read the whole cartridge again.
RESET_REDUMP=0

# 1 = re-check the copy of a cartridge on the SD card every time it starts
# (original firmware behaviour, slower). 0 = trust a copy that was verified.
VERIFY_CACHE=0

# 1 = RetroArch debug log on the serial console
VERBOSE=1
