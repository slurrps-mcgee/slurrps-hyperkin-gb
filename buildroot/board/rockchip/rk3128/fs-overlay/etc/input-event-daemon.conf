#
# /etc/input-event-daemon.conf
#
# Runs a command when one of the console's own buttons is pressed. The reset
# button is wired as a GPIO key that reports F3.
#

[Global]
listen = /dev/input/by-path/platform-gpio-keys-event

[Keys]
#FN        = /usr/bin/volctrl.sh
F3 = /usr/lib/retronsq/reset-btn
