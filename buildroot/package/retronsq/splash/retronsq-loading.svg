<?xml version="1.0" encoding="UTF-8"?>
<!--
  Background of the cartridge loading screen, shown by hyperkin-loading the
  first time a cartridge is read. Rendered at build time (see
  retronsq.mk) to /etc/retronsq-loading.png, with @VERSION_LABEL@ replaced.

  hyperkin-loading draws on top of it, in these 1280x720 coordinates (keep
  them in sync with LOADING_* in hyperkin-loading.cpp):
    game name     top-left (470, 288)
    percent       right edge x=1092, top y=372
    progress bar  inside the track: x=472..1088, y=428..456
    MB / time     top y=476, left x=470 / right edge x=1092
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#151a3f"/>
      <stop offset="1" stop-color="#2a1145"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf4a"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dce6"/>
      <stop offset="1" stop-color="#9aa0b4"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#b14bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="28" height="28" fill="none"/>
      <rect width="9" height="28" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#stripes)"/>

  <!-- top bar -->
  <text x="48" y="64" font-family="DejaVu Sans" font-weight="bold" font-size="26" fill="#ffffff" letter-spacing="3">RETRON SQ</text>
  <rect x="50" y="78" width="160" height="4" rx="2" fill="url(#accent)"/>
  <text x="1232" y="64" font-family="DejaVu Sans" font-size="22" fill="#6f75a8" text-anchor="end">@VERSION_LABEL@</text>

  <!-- cartridge, sliding into the slot -->
  <g transform="translate(150 210) scale(0.85)">
    <path d="M0 18 a18 18 0 0 1 18 -18 h168 l36 36 v262 a18 18 0 0 1 -18 18 h-186 a18 18 0 0 1 -18 -18 z" transform="translate(8 16)" fill="#000000" opacity="0.55" filter="url(#shadow)"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h168 l36 36 v262 a18 18 0 0 1 -18 18 h-186 a18 18 0 0 1 -18 -18 z" fill="url(#cart)"/>
    <rect x="22" y="22" width="150" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    <rect x="28" y="62" width="184" height="150" rx="10" fill="url(#label)"/>
    <text x="120" y="128" font-family="DejaVu Sans" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="4">SQ</text>
    <rect x="58" y="148" width="124" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="78" y="164" width="84" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
    <g fill="#7e8499">
      <rect x="40" y="246" width="12" height="54" rx="3"/>
      <rect x="62" y="246" width="12" height="54" rx="3"/>
      <rect x="84" y="246" width="12" height="54" rx="3"/>
      <rect x="106" y="246" width="12" height="54" rx="3"/>
      <rect x="128" y="246" width="12" height="54" rx="3"/>
      <rect x="150" y="246" width="12" height="54" rx="3"/>
      <rect x="172" y="246" width="12" height="54" rx="3"/>
      <rect x="194" y="246" width="12" height="54" rx="3"/>
    </g>
  </g>
  <!-- arrows: data flowing from the cartridge to the SD card -->
  <g fill="#ffcf4a">
    <path d="M378 330 l18 14 l-18 14 z" opacity="0.35"/>
    <path d="M402 330 l18 14 l-18 14 z" opacity="0.6"/>
    <path d="M426 330 l18 14 l-18 14 z" opacity="0.9"/>
  </g>

  <!-- heading -->
  <text x="468" y="262" font-family="DejaVu Sans" font-weight="bold" font-size="52" fill="#ffffff" letter-spacing="3">READING CARTRIDGE</text>

  <!-- progress bar track (hyperkin-loading fills it) -->
  <rect x="468" y="424" width="624" height="36" rx="18" fill="#0a0d20" stroke="#3a4074" stroke-width="2"/>

  <!-- explanation -->
  <text x="468" y="584" font-family="DejaVu Sans" font-size="24" fill="#c9cdf0">First time only: the game is copied to the SD card.</text>
  <text x="468" y="618" font-family="DejaVu Sans" font-size="24" fill="#c9cdf0">Next time this cartridge starts right away.</text>
  <text x="468" y="664" font-family="DejaVu Sans" font-size="19" fill="#6f75a8">The cartridge slot reads at USB 1.1 speed, about 1 MB per second.</text>
</svg>
