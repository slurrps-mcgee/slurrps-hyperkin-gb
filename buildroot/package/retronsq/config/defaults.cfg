# Retron SQ CFW: default value of every setting in retronsq.cfg (the SD
# card's file says what each one does). The only place defaults live: the
# scripts (CfgDefault in common.sh) and the programs (sq_cfg_get in
# libsqcart) both read this file. Installed as
# /usr/share/retronsq/defaults.cfg.
GBA_CORE=gpsp
GBC_CORE=vbam
GB_CORE=vbam
UI=home
NO_CART=menu
CART_AUTOLOAD=1
CART_WAIT=15
RESET_REDUMP=0
VERIFY_CACHE=0
VERBOSE=1
