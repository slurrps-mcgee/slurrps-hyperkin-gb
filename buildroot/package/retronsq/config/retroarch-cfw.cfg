# Retron SQ CFW: RetroArch settings the firmware depends on. sq-session loads
# this file on top of the SD card's retroarch/retroarch.cfg every time
# (--appendconfig), so cards set up by an older firmware get them too, and a
# change made in the RetroArch menu can't break them.

# Off: this RetroArch is built without networking, and then 1.7.4 reads
# stdin commands with a blocking read and never acts on them, so a stdin
# that doesn't end freezes it. The firmware stops games with SIGTERM
# (KillGame in common.sh). v0.2.0 shipped this as "true", which froze
# RetroArch; this line overrides it on those SD cards.
stdin_cmd_enable = "false"

# Write the in-game save (.srm) to the SD card 2 seconds after it changes,
# so switching the console off soon after saving keeps the save. The write
# is atomic (RetroArch patch 0003).
autosave_interval = "2"
